[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-readiness-framework"
version = "2.0.0"
description = "Framework for evaluating laboratory workflow automation readiness"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Oluwaseun O. Ajayi"}
]
license = {text = "MIT"}
keywords = ["laboratory automation", "workflow assessment", "automation readiness",
            "traceability", "research software"]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Oluwaseun-O-Ajayi/automation-readiness-framework"
Repository = "https://github.com/Oluwaseun-O-Ajayi/automation-readiness-framework"

[tool.setuptools]
packages = ["automation_readiness"]
